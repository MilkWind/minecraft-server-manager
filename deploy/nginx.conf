# Minecraft Server Manager reverse proxy for Windows Nginx.
#
# Copy this file to D:/server_tools/nginx-1.30.2/conf/nginx.conf, or start
# Nginx with: nginx.exe -p D:/server_tools/nginx-1.30.2/ -c <repo>/deploy/nginx.conf

worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    upstream minecraft_manager_backend {
        server 127.0.0.1:8080;
        keepalive 16;
    }

    server {
        listen       80;
        server_name  localhost;

        root   D:/minecraft-server-manager/frondend/dist;
        index  index.html;

        client_max_body_size 20m;

        location /api/ {
            proxy_pass http://minecraft_manager_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 90s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # Enable this server block when you have TLS certificates.
    #
    # server {
    #     listen       443 ssl;
    #     server_name  minecraft.example.com;
    #
    #     ssl_certificate      D:/server_tools/certs/fullchain.pem;
    #     ssl_certificate_key  D:/server_tools/certs/privkey.pem;
    #
    #     root   D:/minecraft-server-manager/frondend/dist;
    #     index  index.html;
    #
    #     location /api/ {
    #         proxy_pass http://minecraft_manager_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_set_header Connection "";
    #     }
    #
    #     location / {
    #         try_files $uri $uri/ /index.html;
    #     }
    # }
}
